name: ELMS 360 Enterprise CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Build, Lint & Automated Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: ESLint Code Quality Inspection
        run: npm run lint

      - name: Run Test Suite (State Machine, Ledger, Calculations, RBAC)
        run: npm test

      - name: Production Next.js Build
        run: npm run build
